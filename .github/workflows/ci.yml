name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build:static
        working-directory: web
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scopeweaver_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scopeweaver_test -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check shell syntax
        run: |
          for script in *.sh; do bash -n "$script"; done
          sh -n start.sh
      - name: Run all Go packages with separate disposable databases
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: scopeweaver_test
          PGPASSWORD: test_only_password
        run: |
          set -euo pipefail
          psql -d postgres -c 'SELECT 1'
          index=0
          status=0
          while IFS= read -r package; do
            index=$((index + 1))
            database="scopeweaver_test_${index}"
            createdb "$database"
            if ! ARTEX_PG_DSN="postgres://${PGUSER}:${PGPASSWORD}@localhost:5432/${database}?sslmode=disable" go test -p 1 "$package" -count=1; then
              status=1
            fi
            dropdb --force "$database"
          done < <(go list ./...)
          exit "$status"
