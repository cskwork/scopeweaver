name: Repair v0.2.1 license notice packaging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release to repair (v0.2.1 only; tag and application stay unchanged)"
        required: true
        default: v0.2.1
        type: string
      immutable_base_image_digest:
        description: "Current ghcr.io/cskwork/scopeweaver:v0.2.1 multiarch sha256 digest"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: repair-v0.2.1-notices
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'cskwork/scopeweaver'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BASE_DIGEST: ${{ inputs.immutable_base_image_digest }}
      IMAGE: ghcr.io/cskwork/scopeweaver
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test packaging verification guards
        run: python3 -m unittest discover -s e2e -p 'test_release_notices.py' -v
      - name: Validate scope and download original assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v0.2.1 ]]
          [[ "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(git rev-parse v0.2.1^{commit})" == 26c6b2e75e715f33f862384894dfef29a46e5a7c ]]
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          # Do not accidentally replace the original checksum record on a repeated run.
          jq -e 'all(.assets[]; .name != "SHA256SUMS.original")' "$RUNNER_TEMP/release-assets.json"
          mkdir -p original
          gh release download "$RELEASE_TAG" --dir original --pattern SHA256SUMS --pattern 'scopeweaver-0.2.1-*.zip'
          git show v0.2.1:web/src/styles/shadcn.css > "$RUNNER_TEMP/tagged-shadcn.css"
          python3 - <<'PY'
          import os
          from pathlib import Path
          header = Path(os.environ["RUNNER_TEMP"], "tagged-shadcn.css").read_text().split(" */", 1)[0]
          expected = "\n".join(line.removeprefix(" * ").removeprefix(" *") for line in header.splitlines()[1:]) + "\n"
          if Path("THIRD_PARTY_NOTICES.txt").read_text() != expected:
              raise SystemExit("Canonical notice differs from the v0.2.1 source header")
          PY
          python3 e2e/repair-release-notices.py archives original "$RELEASE_TAG" repaired THIRD_PARTY_NOTICES.txt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable base and prepare notice-only image
        shell: bash
        run: |
          set -euo pipefail
          current="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$current" == "$BASE_DIGEST" ]]
          # The index must contain both existing Linux runtime architectures.
          docker buildx imagetools inspect "$IMAGE@$BASE_DIGEST" --format '{{json .Manifest}}' > repaired/original-image-index.json
          mkdir "$RUNNER_TEMP/notice-image"
          cp THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/notice-image/THIRD_PARTY_NOTICES.txt"
          printf 'FROM %s@%s\nCOPY THIRD_PARTY_NOTICES.txt /app/THIRD_PARTY_NOTICES.txt\n' "$IMAGE" "$BASE_DIGEST" > "$RUNNER_TEMP/notice-image/Dockerfile"
          candidate="$IMAGE:notice-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            --file "$RUNNER_TEMP/notice-image/Dockerfile" --tag "$candidate" --push "$RUNNER_TEMP/notice-image"
          python3 e2e/repair-release-notices.py images "$BASE_DIGEST" "$candidate" repaired THIRD_PARTY_NOTICES.txt
          docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' > repaired/corrected-image-index.json
          echo "candidate=$candidate" >> "$GITHUB_ENV"
      - name: Retain original assets and complete verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: v0.2.1-notice-repair-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            original/
            repaired/
            THIRD_PARTY_NOTICES.txt
      - name: Publish validated packaging replacements
        shell: bash
        run: |
          set -euo pipefail
          # Guard against a concurrent image update while the candidate was validated.
          current="$(docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$current" == "$BASE_DIGEST" ]]
          latest="$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$latest" == "$BASE_DIGEST" ]]
          digest="$(cat repaired/corrected-image-digest.txt)"
          # Application bytes and runtime configuration were verified before official tag changes.
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:latest" "$IMAGE@$digest"
          for tag in "$RELEASE_TAG" latest; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$actual" == "$digest" ]]
          done
          gh release upload "$RELEASE_TAG" repaired/SHA256SUMS.original
          gh release upload "$RELEASE_TAG" THIRD_PARTY_NOTICES.txt
          gh release upload "$RELEASE_TAG" repaired/scopeweaver-0.2.1-*.zip repaired/SHA256SUMS --clobber
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --dir downloaded --pattern SHA256SUMS --pattern SHA256SUMS.original --pattern 'scopeweaver-0.2.1-*.zip'
          cmp repaired/SHA256SUMS.original downloaded/SHA256SUMS.original
          cmp repaired/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check SHA256SUMS)
          {
            echo '### v0.2.1 packaging correction'
            echo 'Tag and application bytes are unchanged. Only third-party license notices were added.'
            echo "Original image: \`$BASE_DIGEST\`"
            echo "Corrected image: \`$digest\`"
            echo 'Original and corrected archive checksums, executable hashes, layer manifests and original archives are retained in the workflow artifact.'
            echo 'The maintainer must disclose the replacement digests in the release notes.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain evidence after publication failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v0.2.1-notice-repair-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            original/
            repaired/
            downloaded/
